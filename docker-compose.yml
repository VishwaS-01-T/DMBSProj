version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: scholarlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scholarlink
      MYSQL_USER: scholarlink
      MYSQL_PASSWORD: scholarlink
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
